[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odoid"
version = "1.0.2"
description = "Deterministic mixed-radix ID encoding — maps integers to 6, 7, or 8-character alphanumeric strings."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["id", "encoding", "mixed-radix", "serial-number", "deterministic"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.urls]
Homepage      = "https://github.com/Webictbyleo/odoid"
Repository    = "https://github.com/Webictbyleo/odoid.git"
Issues        = "https://github.com/Webictbyleo/odoid/issues"
Specification = "https://github.com/Webictbyleo/odoid/blob/main/SPEC.md"
Source        = "https://github.com/Webictbyleo/odoid/tree/main/python"

[tool.hatch.build.targets.wheel]
packages = ["src/odoid"]

[tool.hatch.build.targets.sdist]
include = ["src/", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v"

[dependency-groups]
dev = ["pytest>=8.0"]
